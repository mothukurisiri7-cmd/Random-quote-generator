<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Random Quote Generator</title>

  <style>
    body.dark {
  background: #121212;
}

body.dark .container {
  background: #1e1e1e;
  color: white;
}

body.dark .quote {
  color: white;
}

body.dark .author {
  color: #ccc;
}

body.dark button {
  background: #333;
  color: white;
}
/* Fade + slide animation for quote change */
.fade {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.4s ease;
}
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:600px;
      background:white;
      padding:40px 30px;
      border-radius:16px;
      text-align:center;
      box-shadow:0 4px 15px rgba(0,0,0,0.08);
  
    }

    h1{
      color:#222;
      margin-bottom:30px;
      font-size:2rem;
    }

    .quote{
      font-size:1.5rem;
      line-height:1.7;
      color:#333;
      margin-bottom:20px;
      min-height:120px;
    }

    .author{
      color:#777;
      margin-bottom:30px;
      font-size:1rem;
    }

    button{
      padding:12px 28px;
      border:none;
      background:#222;
      color:white;
      border-radius:8px;
      font-size:1rem;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#444;
    }

    @media(max-width:600px){

      .quote{
        font-size:1.2rem;
      }

      h1{
        font-size:1.6rem;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Random Quote</h1>

    <div class="quote" id="quote">
      Loading quote...
    </div>

    <div class="author" id="author"></div>

    <button onclick="getQuote()">
      New Quote
    </button>
    <button onclick="toggleTheme()">🌙 Theme</button>

  </div>

  <script>

    async function getQuote(){

      try{

        // API Request
        const response = await fetch(
  "https://dummyjson.com/quotes/random",
  {
    method: "GET"
  }
);

        // Convert response into JSON
        const data = await response.json();

        // Display quote
        document.getElementById("quote").innerText =
          `"${data.quote}"`;

        // Display author
        document.getElementById("author").innerText =
          `— ${data.author}`;

      }

        catch(error){
  console.log(error);

  document.getElementById("quote").innerText =
    "Failed to load quote.";

  document.getElementById("author").innerText = error;
}
        
}
function toggleTheme() {
  document.body.classList.toggle("dark");

    }

    // Load random quote when app opens
    getQuote();

  </script>

</body>
</html>
